name: Repository SRE Metrics & Quality Gate

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Mondays at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-gate:
    name: SRE Quality Gate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gh-stats PR Quality Gate
        uses: smford/gh-stats@2a54880d552da012a17d0b4e58d8d3ce9d643942 # v0.11.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: 'CRITICAL'
          pr-comment: 'true'

  weekly-analysis:
    name: Hotspot & Churn Analysis
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Repository Hotspot Analysis
        uses: smford/gh-stats@2a54880d552da012a17d0b4e58d8d3ce9d643942 # v0.11.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          analysis-mode: 'hotspots'
