name: Dependabot Patch Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  actions: write

jobs:
  check-and-release:
    name: Autonomous Dependabot Release
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || contains(github.event.head_commit.author.name, 'dependabot')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Next Patch Version
        id: semver
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "Latest tag: $LATEST_TAG"

          # Parse vMAJOR.MINOR.PATCH
          CLEAN="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"

          echo "Next tag: $NEXT_TAG"
          echo "next_tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Tag
        env:
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "chore(release): autonomous dependabot patch release ${NEXT_TAG}"
          git push origin "$NEXT_TAG"
