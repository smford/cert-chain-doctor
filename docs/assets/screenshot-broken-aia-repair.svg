  <text x="430.0" y="22" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="500">cert-chain-doctor api.example.com --fix-bundle</text>
  <text font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" xml:space="preserve">
    <tspan x="22" y="46"><tspan style="fill: #3fb950; font-weight: bold;">$ </tspan><tspan style="fill: #e6edf3; font-weight: bold;">cert-chain-doctor api.example.com --fix-bundle /etc/ssl/repaired.pem</tspan></tspan>
    <tspan x="22" y="66"><tspan style="fill: #8b949e;">================================================================================</tspan></tspan>
    <tspan x="22" y="86"><tspan style="fill: #f85149; font-weight: bold;">              CERT CHAIN DOCTOR - TLS &amp; CHAIN DIAGNOSTIC</tspan></tspan>
    <tspan x="22" y="106"><tspan style="fill: #8b949e;">================================================================================</tspan></tspan>
    <tspan x="22" y="126"><tspan style="fill: #8b949e;">Target:     </tspan><tspan style="fill: #e6edf3; font-weight: bold;">api.example.com:443</tspan></tspan>
    <tspan x="22" y="146"><tspan style="fill: #8b949e;">SNI:        </tspan><tspan style="fill: #79c0ff;">api.example.com</tspan></tspan>
    <tspan x="22" y="166"><tspan style="fill: #8b949e;">Remote IP:  </tspan><tspan style="fill: #e6edf3;">93.184.216.34:443</tspan></tspan>
    <tspan x="22" y="186"><tspan style="fill: #8b949e;">TLS Conn:   </tspan><tspan style="fill: #e6edf3;">TLS 1.3 | TLS_AES_128_GCM_SHA256 | Handshake: 14ms</tspan></tspan>
    <tspan x="22" y="206"><tspan style="fill: #e6edf3;"></tspan></tspan>
    <tspan x="22" y="226"><tspan style="fill: #e3b341; font-weight: bold;">CERTIFICATE CHAIN TREE:</tspan></tspan>
    <tspan x="22" y="246"><tspan style="fill: #8b949e;">├── [0] Leaf: </tspan><tspan style="fill: #e6edf3; font-weight: bold;">api.example.com</tspan></tspan>
    <tspan x="22" y="266"><tspan style="fill: #8b949e;">│   ├── Subject:  </tspan><tspan style="fill: #e6edf3;">CN=api.example.com, O=Example Corp</tspan></tspan>
    <tspan x="22" y="286"><tspan style="fill: #8b949e;">│   ├── Issuer:   </tspan><tspan style="fill: #8b949e;">CN=DigiCert Global G2 TLS RSA SHA256 2020 CA1</tspan></tspan>
    <tspan x="22" y="306"><tspan style="fill: #8b949e;">│   ├── Validity: </tspan><tspan style="fill: #e6edf3;">2026-10-01 to 2027-01-01 (68 days left)</tspan></tspan>
    <tspan x="22" y="326"><tspan style="fill: #8b949e;">│   ├── AKI:      </tspan><tspan style="fill: #8b949e;">5F:87:AF:B0...0E:F1:42:00 -&gt; </tspan><tspan style="fill: #f85149; font-weight: bold;">MISSING INTERMEDIATE</tspan></tspan>
    <tspan x="22" y="346"><tspan style="fill: #8b949e;">│   └── AIA URL:  </tspan><tspan style="fill: #79c0ff;">http://cacerts.digicert.com/DigiCertGlobalG2TLSRSASHA2562020CA1-1.crt</tspan></tspan>
    <tspan x="22" y="366"><tspan style="fill: #8b949e;">│</tspan></tspan>
    <tspan x="22" y="386"><tspan style="fill: #8b949e;">└── [1] Intermediate </tspan><tspan style="fill: #3fb950; font-weight: bold;">(RESOLVED VIA AIA)</tspan><tspan style="fill: #e6edf3; font-weight: bold;">: DigiCert Global G2 TLS CA</tspan></tspan>
    <tspan x="22" y="406"><tspan style="fill: #8b949e;">    ├── Subject:  </tspan><tspan style="fill: #e6edf3;">CN=DigiCert Global G2 TLS RSA SHA256 2020 CA1, O=DigiCert Inc</tspan></tspan>
    <tspan x="22" y="426"><tspan style="fill: #8b949e;">    ├── Issuer:   </tspan><tspan style="fill: #8b949e;">CN=DigiCert Global Root G2</tspan></tspan>
    <tspan x="22" y="446"><tspan style="fill: #8b949e;">    ├── Validity: </tspan><tspan style="fill: #e6edf3;">2020-09-23 to 2030-09-22 (1428 days left)</tspan></tspan>
    <tspan x="22" y="466"><tspan style="fill: #8b949e;">    ├── Download: </tspan><tspan style="fill: #3fb950;">HTTP GET 200 OK (application/pkix-cert, 1284 bytes)</tspan></tspan>
    <tspan x="22" y="486"><tspan style="fill: #8b949e;">    └── Verified: </tspan><tspan style="fill: #3fb950; font-weight: bold;">Cryptographic signature matches Leaf certificate</tspan></tspan>
    <tspan x="22" y="506"><tspan style="fill: #e6edf3;"></tspan></tspan>
    <tspan x="22" y="526"><tspan style="fill: #e3b341; font-weight: bold;">FINDINGS &amp; DIAGNOSIS:</tspan></tspan>
    <tspan x="22" y="546"><tspan style="fill: #8b949e;">  [</tspan><tspan style="fill: #f85149; font-weight: bold;">ERROR</tspan><tspan style="fill: #8b949e;">] </tspan><tspan style="fill: #f85149; font-weight: bold;">MISSING_INTERMEDIATE_AIA_AVAILABLE</tspan></tspan>
    <tspan x="22" y="566"><tspan style="fill: #8b949e;">          Chain is missing intermediate CA (&#x27;unknown authority&#x27; in curl/Alpine/Go).</tspan></tspan>
    <tspan x="22" y="586"><tspan style="fill: #79c0ff;">          AIA download URL found: http://cacerts.digicert.com/...-1.crt</tspan></tspan>
    <tspan x="22" y="606"><tspan style="fill: #8b949e;">  [</tspan><tspan style="fill: #3fb950; font-weight: bold;">REPAIRED</tspan><tspan style="fill: #3fb950; font-weight: bold;">] Wrote repaired fullchain bundle to /etc/ssl/repaired.pem</tspan></tspan>
    <tspan x="22" y="626"><tspan style="fill: #8b949e;">--------------------------------------------------------------------------------</tspan></tspan>
    <tspan x="22" y="646"><tspan style="fill: #8b949e;">VERDICT: </tspan><tspan style="fill: #3fb950; font-weight: bold;">REPAIRED: Missing intermediate fetched via AIA and verified</tspan></tspan>
    <tspan x="22" y="666"><tspan style="fill: #8b949e;">--------------------------------------------------------------------------------</tspan></tspan>
  </text>
