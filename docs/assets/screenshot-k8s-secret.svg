    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242c" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <!-- Window Background -->
  <rect width="860" height="408" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 850 0 C 855.523 0 860 4.477 860 10 L 860 36 L 0 36 Z" fill="url(#headerGrad)" stroke="#30363d" stroke-width="1.2" />
  <line x1="0" y1="36" x2="860" y2="36" stroke="#30363d" stroke-width="1" />
  <circle cx="20" cy="18" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="38" cy="18" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="56" cy="18" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
  <text x="430.0" y="22" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="500">cert-chain-doctor --k8s-secret api-tls</text>
  <text font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" xml:space="preserve">
    <tspan x="22" y="46"><tspan style="fill: #3fb950; font-weight: bold;">$ </tspan><tspan style="fill: #e6edf3; font-weight: bold;">cert-chain-doctor api.example.com --k8s-secret api-tls --k8s-namespace production</tspan></tspan>
    <tspan x="22" y="66"><tspan style="fill: #d2a8ff;">apiVersion: </tspan><tspan style="fill: #e6edf3; font-weight: bold;">v1</tspan></tspan>
    <tspan x="22" y="86"><tspan style="fill: #d2a8ff;">kind: </tspan><tspan style="fill: #e6edf3; font-weight: bold;">Secret</tspan></tspan>
    <tspan x="22" y="106"><tspan style="fill: #d2a8ff;">metadata:</tspan></tspan>
    <tspan x="22" y="126"><tspan style="fill: #e6edf3;">  name: </tspan><tspan style="fill: #3fb950; font-weight: bold;">api-tls</tspan></tspan>
    <tspan x="22" y="146"><tspan style="fill: #e6edf3;">  namespace: </tspan><tspan style="fill: #79c0ff; font-weight: bold;">production</tspan></tspan>
    <tspan x="22" y="166"><tspan style="fill: #d2a8ff;">  annotations:</tspan></tspan>
    <tspan x="22" y="186"><tspan style="fill: #8b949e;">    cert-chain-doctor.io/repaired-at: </tspan><tspan style="fill: #e3b341;">&quot;2026-10-24T02:40:00Z&quot;</tspan></tspan>
    <tspan x="22" y="206"><tspan style="fill: #8b949e;">    cert-chain-doctor.io/source: </tspan><tspan style="fill: #e6edf3;">&quot;api.example.com:443&quot;</tspan></tspan>
    <tspan x="22" y="226"><tspan style="fill: #d2a8ff;">type: </tspan><tspan style="fill: #79c0ff; font-weight: bold;">kubernetes.io/tls</tspan></tspan>
    <tspan x="22" y="246"><tspan style="fill: #d2a8ff;">data:</tspan></tspan>
    <tspan x="22" y="266"><tspan style="fill: #e6edf3;">  tls.crt: </tspan><tspan style="fill: #8b949e;">LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUZkekNDQTErZ0F3S... (repaired fullchain)</tspan></tspan>
    <tspan x="22" y="286"><tspan style="fill: #e6edf3;">  tls.key: </tspan><tspan style="fill: #8b949e;">&quot;&quot;</tspan><tspan style="fill: #8b949e;">  # populate with base64 private key before applying</tspan></tspan>
    <tspan x="22" y="306"><tspan style="fill: #e6edf3;"></tspan></tspan>
    <tspan x="22" y="326"><tspan style="fill: #8b949e;"># Apply directly with kubectl:</tspan></tspan>
    <tspan x="22" y="346"><tspan style="fill: #3fb950; font-weight: bold;">$ </tspan><tspan style="fill: #79c0ff; font-weight: bold;">cert-chain-doctor api.example.com --k8s-secret api-tls | kubectl apply -f -</tspan></tspan>
    <tspan x="22" y="366"><tspan style="fill: #3fb950; font-weight: bold;">secret/api-tls created in namespace production</tspan></tspan>
  </text>
</svg>
